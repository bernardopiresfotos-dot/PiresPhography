<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotografia</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f1115">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/3b82f6/ffffff.png?text=FOTOS">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #262a34; }
    header h1 { font-size: 1.4rem; }
    .btn {
      background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 8px;
      text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: inline-block;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-back { background: #262a34; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card {
      background: var(--card); padding: 22px; border-radius: 10px; cursor: pointer;
      border: 1px solid #262a34; transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .card span { font-size: 0.85rem; color: var(--muted); }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .photo { position: relative; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; background: var(--card); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dl { position: absolute; bottom: 10px; right: 10px; background: rgba(59, 130, 246, 0.92); padding: 7px 12px; font-size: 0.8rem; }
    .status { text-align: center; color: var(--muted); padding: 40px 10px; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">📸 Galeria de Jogos</h1>
    </header>
    <button id="back" class="btn btn-back" style="display:none;" onclick="goBack()">← Voltar</button>
    <div id="content">
      <p class="status">A carregar...</p>
    </div>
  </div>

  <script>
    const content = document.getElementById('content');
    const title = document.getElementById('title');
    const back = document.getElementById('back');
    let historyStack = [];

    async function loadFolder(folderId = '', folderName = '📸 Galeria de Jogos', isGoingBack = false) {
      if (!isGoingBack) {
        historyStack.push({ id: folderId, name: folderName });
      }

      title.textContent = folderName;
      back.style.display = historyStack.length > 1 ? 'inline-block' : 'none';
      content.innerHTML = '<p class="status">A carregar...</p>';

      try {
        const url = folderId ? `/.netlify/functions/drive?folderId=${folderId}` : '/.netlify/functions/drive';
        const res = await fetch(url);
        const items = await res.json();

        if (items.error) {
          content.innerHTML = `<p class="status">Erro: ${items.error}</p>`;
          return;
        }

        if (!items.length) {
          content.innerHTML = '<p class="status">Esta pasta está vazia.</p>';
          return;
        }

        const folders = items.filter(i => i.isFolder);
        const photos = items.filter(i => !i.isFolder);
        let html = '';

        if (folders.length) {
          html += `<div class="grid">${folders.map(f => `
            <div class="card" onclick="loadFolder('${f.id}', '${f.name.replace(/'/g, "\'")}')">
              <h3>📁 ${f.name}</h3>
              <span>Abrir pasta</span>
            </div>
          `).join('')}</div>`;
        }

        if (photos.length) {
          html += `<div class="photo-grid">${photos.map(p => `
            <div class="photo">
              <img src="${p.preview}" loading="lazy" alt="${p.name}">
              <a href="${p.download}" class="btn dl" download>⬇ Download</a>
            </div>
          `).join('')}</div>`;
        }

        content.innerHTML = html;
      } catch (e) {
        content.innerHTML = '<p class="status">Erro ao ligar ao servidor.</p>';
      }
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        loadFolder(prev.id, prev.name, true);
      }
    }

    loadFolder();
  </script>
</body>
</html>
