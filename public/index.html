<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotografia</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f1115">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/3b82f6/ffffff.png?text=FOTOS">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #262a34; }
    header h1 { font-size: 1.4rem; }
    .btn {
      background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 8px;
      text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: inline-block;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-back { background: #262a34; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); padding: 22px; border-radius: 10px; cursor: pointer;
      border: 1px solid #262a34; transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .card span { font-size: 0.85rem; color: var(--muted); }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .photo { position: relative; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; background: var(--card); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dl { position: absolute; bottom: 10px; right: 10px; background: rgba(59, 130, 246, 0.92); padding: 7px 12px; font-size: 0.8rem; }
    .status { text-align: center; color: var(--muted); padding: 40px 10px; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">📸 Galeria de Jogos</h1>
    </header>
    <button id="back" class="btn btn-back" style="display:none;" onclick="loadGames()">← Voltar aos Jogos</button>
    <div id="content">
      <p class="status">A carregar jogos...</p>
    </div>
  </div>

  <script>
    const content = document.getElementById('content');
    const title = document.getElementById('title');
    const back = document.getElementById('back');

    async function loadGames() {
      title.textContent = '📸 Galeria de Jogos';
      back.style.display = 'none';
      content.innerHTML = '<p class="status">A carregar jogos...</p>';

      try {
        const res = await fetch('/.netlify/functions/drive');
        const games = await res.json();

        if (games.error) {
          content.innerHTML = `<p class="status">Erro: ${games.error}</p>`;
          return;
        }

        if (!games.length) {
          content.innerHTML = '<p class="status">Ainda não existem pastas de jogos publicadas.</p>';
          return;
        }

        content.innerHTML = `<div class="grid">${games.map(g => `
          <div class="card" onclick="loadPhotos('${g.id}', '${g.name.replace(/'/g, "\'")}')">
            <h3>📁 ${g.name}</h3>
            <span>Tocar para ver fotografias</span>
          </div>
        `).join('')}</div>`;
      } catch (e) {
        content.innerHTML = '<p class="status">Erro ao ligar ao servidor.</p>';
      }
    }

    async function loadPhotos(id, name) {
      title.textContent = name;
      back.style.display = 'inline-block';
      content.innerHTML = '<p class="status">A carregar fotografias...</p>';

      try {
        const res = await fetch(`/.netlify/functions/drive?folderId=${id}`);
        const photos = await res.json();

        if (!photos.length) {
          content.innerHTML = '<p class="status">Esta pasta ainda não tem fotografias.</p>';
          return;
        }

        content.innerHTML = `<div class="photo-grid">${photos.map(p => `
          <div class="photo">
            <img src="${p.preview}" loading="lazy" alt="${p.name}">
            <a href="${p.download}" class="btn dl" download>⬇ Download</a>
          </div>
        `).join('')}</div>`;
      } catch (e) {
        content.innerHTML = '<p class="status">Erro ao carregar fotografias.</p>';
      }
    }

    loadGames();
  </script>
</body>
</html>
